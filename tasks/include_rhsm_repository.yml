---
# Shared helper included from subscription-manager.yml with include_tasks. The
# rhsm_repository arguments are passed in as the __rhc_rhsm_repository_args dict;
# the loop is handled by the parent include_tasks task. include_tasks is
# dynamic: its tasks are only parsed when the include runs, and a task skipped
# by its "when" (the community.general module on ansible 2.9) never has its FQCN
# resolved, so it cannot abort play parsing the way it would in a statically
# parsed task file.

# On managed nodes with python < 3.7, the latest community.general.rhsm_repository
# fails to import ("from __future__ import annotations" requires python >=
# 3.7), so use the dependency-free vendored rhsm_repository_python_36 module.
- name: Configure repositories - python 3.6
  rhsm_repository_python_36: "{{ __rhc_rhsm_repository_args }}"
  when:
    - not (ansible_facts['python_version'] is version('3.7', '>='))

# On managed nodes with python >= 3.7, use community.general.rhsm_repository.
- name: Configure repositories
  community.general.rhsm_repository: "{{ __rhc_rhsm_repository_args }}"
  when:
    - ansible_facts['python_version'] is version('3.7', '>=')
